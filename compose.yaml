services:
  app:
    build: .
    ports:
      - "127.0.0.1:${TASKHUB_PORT:-8000}:8000"
    environment:
      DEBUG: "false"
      ENABLE_DOCS: "${ENABLE_DOCS:-false}"
      DATABASE_URL: "mysql+aiomysql://${MYSQL_USER:-taskhub}:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}@db:3306/${MYSQL_DATABASE:-taskhub_db}?charset=utf8mb4"
      REDIS_URL: "redis://redis:6379/0"
      TASK_LIST_CACHE_TTL_SECONDS: "${TASK_LIST_CACHE_TTL_SECONDS:-60}"
      REDIS_SOCKET_TIMEOUT_SECONDS: "${REDIS_SOCKET_TIMEOUT_SECONDS:-0.25}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL:-noreply@taskhub.local}"
      SMTP_USE_TLS: "${SMTP_USE_TLS:-true}"
      SMTP_TIMEOUT_SECONDS: "${SMTP_TIMEOUT_SECONDS:-5.0}"
    volumes:
      - jwt_keys:/app/.keys
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        if [ ! -e .keys/private.pem ] && [ ! -e .keys/public.pem ]; then
          python scripts/generate_auth_keys.py
        elif [ ! -f .keys/private.pem ] || [ ! -f .keys/public.pem ]; then
          echo 'Incomplete JWT key pair in /app/.keys' >&2
          exit 1
        fi
        python -m alembic upgrade head
        exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthy', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-taskhub_db}"
      MYSQL_USER: "${MYSQL_USER:-taskhub}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1
          --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --execute="SELECT 1"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  mysql_data:
  jwt_keys:
